
name: Publish XMRig addon images to GHCR

on:
  push:
    branches:
      - main
      - develop-v2
    tags:
      - "v2.*"

  pull_request:
    branches:
      - main
      - develop-v2

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================
  # 1. RELEASE SECURITY POLICY
  # ============================================

  release-policy:
    name: Validate release policy
    runs-on: ubuntu-latest

    outputs:
      push_image: ${{ steps.policy.outputs.push_image }}
      image_tag: ${{ steps.policy.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine publication permissions
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PUSH_IMAGE=false
          IMAGE_TAG=development

          # Development builds never publish.

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Pull request: build only"

          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run: build only"

          elif [[ "$EVENT_NAME" == "push" ]]; then

            # Stable main branch
            if [[ "$GIT_REF" == "refs/heads/main" ]]; then

              PUSH_IMAGE=true
              IMAGE_TAG=latest

              echo "Approved main branch push"

            # Version 2 release tags
            elif [[ "$GIT_REF" == refs/tags/v2.* ]]; then

              echo "Validating release tag: $REF_NAME"

              # Supported formats:
              # v2.0.0
              # v2.0.0-beta.1

              if [[ ! "$REF_NAME" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
                echo "ERROR: Invalid release tag format"
                exit 1
              fi

              # Fetch current stable branch.
              git fetch --no-tags origin \
                +refs/heads/main:refs/remotes/origin/main

              MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
              RELEASE_SHA=$(git rev-parse HEAD)

              echo "Main commit: $MAIN_SHA"
              echo "Release commit: $RELEASE_SHA"

              # Only the current main commit may be tagged.
              if [[ "$RELEASE_SHA" != "$MAIN_SHA" ]]; then
                echo "ERROR: Release tag does not point to current main HEAD"
                exit 1
              fi

              PUSH_IMAGE=true
              IMAGE_TAG="$REF_NAME"

              if [[ "$REF_NAME" == *-beta.* ]]; then
                echo "Beta release approved"
              else
                echo "Stable release approved"
              fi

            else
              echo "Development branch: build only"
            fi

          fi

          echo "push_image=$PUSH_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "Publish image: $PUSH_IMAGE"
          echo "Image tag: $IMAGE_TAG"

  # ============================================
  # 2. LEGACY SUPERVISED / MSR BUILD
  # ============================================

  build-amd64-supervised:
    name: Build AMD64 Supervised/MSR
    runs-on: ubuntu-latest

    needs:
      - release-policy

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image owner
        id: owner
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          OWNER_LC="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: needs.release-policy.outputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push Supervised/MSR
        uses: docker/build-push-action@v7
        with:
          context: ./xmrig
          push: ${{ needs.release-policy.outputs.push_image == 'true' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER_LC }}/amd64-ha-xmrig-addon:${{ needs.release-policy.outputs.image_tag }}

  # ============================================
  # 3. HAOS SAFE BUILD
  # ============================================

  build-amd64-haos:
    name: Build AMD64 HAOS Safe
    runs-on: ubuntu-latest

    needs:
      - release-policy

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image owner
        id: owner
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          OWNER_LC="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: needs.release-policy.outputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push HAOS Safe
        uses: docker/build-push-action@v7
        with:
          context: ./xmrig_haos
          push: ${{ needs.release-policy.outputs.push_image == 'true' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER_LC }}/amd64-ha-xmrig-addon-haos:${{ needs.release-policy.outputs.image_tag }}
