
name: Publish XMRig addon images to GHCR

on:
  push:
    branches:
      - main
      - develop-v2
    tags:
      - "v2.*"

  pull_request:
    branches:
      - main
      - develop-v2

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================
  # 1. SHARED RELEASE SECURITY POLICY
  # ============================================

  release-policy:
    name: Validate release policy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      push_image: ${{ steps.policy.outputs.push_image }}
      image_tag: ${{ steps.policy.outputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------
      # Verify shared policy script
      # ------------------------------------------

      - name: Validate release policy script
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/release_policy.sh

          bash -n scripts/release_policy.sh

          echo "PASS: Shared release policy syntax"

      # ------------------------------------------
      # Execute shared release policy
      # ------------------------------------------

      - name: Determine publication permissions
        id: policy
        shell: bash

        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          RELEASE_SHA=""
          MAIN_SHA=""

          # --------------------------------------
          # Release tag verification
          # --------------------------------------

          if [[ "$EVENT_NAME" == "push" &&
                "$GIT_REF" == refs/tags/v2.* ]]; then

            echo "Release tag detected: $REF_NAME"

            # Fetch the authoritative main branch.
            git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main

            # Resolve main to its commit.
            MAIN_SHA="$(git rev-parse --verify \
              refs/remotes/origin/main^{commit})"

            # Resolve the checked-out release commit.
            RELEASE_SHA="$(git rev-parse --verify \
              HEAD^{commit})"

            # Confirm the checked-out commit matches
            # the GitHub event commit.
            EVENT_COMMIT="$(git rev-parse --verify \
              "${EVENT_SHA}^{commit}")"

            if [[ "$RELEASE_SHA" != "$EVENT_COMMIT" ]]; then
              echo "ERROR: Release checkout mismatch"
              exit 1
            fi

            echo "Main SHA: $MAIN_SHA"
            echo "Release SHA: $RELEASE_SHA"

          else

            echo "Non-release event detected"

          fi

          # --------------------------------------
          # Run shared release policy
          # --------------------------------------

          export EVENT_NAME
          export GIT_REF
          export REF_NAME
          export RELEASE_SHA
          export MAIN_SHA

          bash scripts/release_policy.sh

      # ------------------------------------------
      # Display policy outcome
      # ------------------------------------------

      - name: Display publication policy
        shell: bash
        env:
          PUSH_IMAGE: ${{ steps.policy.outputs.push_image }}
          IMAGE_TAG: ${{ steps.policy.outputs.image_tag }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "XMRig 2.0 Release Policy"
          echo "======================================"
          echo "Publish image: $PUSH_IMAGE"
          echo "Image tag: $IMAGE_TAG"
          echo "======================================"

  # ============================================
  # 2. LEGACY SUPERVISED / MSR BUILD
  # ============================================

  build-amd64-supervised:
    name: Build AMD64 Supervised/MSR
    runs-on: ubuntu-latest

    needs:
      - release-policy

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ------------------------------------------
      # Normalize GHCR owner
      # ------------------------------------------

      - name: Compute image owner
        id: owner
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          OWNER_LC="$(echo "$REPOSITORY_OWNER" \
            | tr '[:upper:]' '[:lower:]')"

          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # Authenticate only for approved publishing
      # ------------------------------------------

      - name: Log in to GHCR
        if: needs.release-policy.outputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Build and optionally publish legacy image
      # ------------------------------------------

      - name: Build and optionally push Supervised/MSR
        uses: docker/build-push-action@v7
        with:
          context: ./xmrig
          push: ${{ needs.release-policy.outputs.push_image == 'true' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER_LC }}/amd64-ha-xmrig-addon:${{ needs.release-policy.outputs.image_tag }}

  # ============================================
  # 3. HAOS SAFE BUILD
  # ============================================

  build-amd64-haos:
    name: Build AMD64 HAOS Safe
    runs-on: ubuntu-latest

    needs:
      - release-policy

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ------------------------------------------
      # Normalize GHCR owner
      # ------------------------------------------

      - name: Compute image owner
        id: owner
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          OWNER_LC="$(echo "$REPOSITORY_OWNER" \
            | tr '[:upper:]' '[:lower:]')"

          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # Authenticate only for approved publishing
      # ------------------------------------------

      - name: Log in to GHCR
        if: needs.release-policy.outputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Build and optionally publish HAOS image
      # ------------------------------------------

      - name: Build and optionally push HAOS Safe
        uses: docker/build-push-action@v7
        with:
          context: ./xmrig_haos
          push: ${{ needs.release-policy.outputs.push_image == 'true' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER_LC }}/amd64-ha-xmrig-addon-haos:${{ needs.release-policy.outputs.image_tag }}
