
name: XMRig Miner (HAOS Safe)
slug: xmrig_haos

description: >-
  Lightweight XMRig miner for Home Assistant OS (HAOS).
  No MSR tuning, no host access, no privileged mode.
  Works with Protection Mode ON.

# Add-on version (independent of XMRig core version)
# XMRig core version: 6.26.0
version: "6.21.9"

url: "https://github.com/Bearstorm/ha-xmrig-addon"

arch:
  - amd64

startup: services
boot: auto
init: false

# Security: no host-level access
host_network: false
host_pid: false
full_access: false
apparmor: true

# Default configuration
options:
  pool: "pool.supportxmr.com"
  port: 443
  wallet: ""
  worker: "HA"
  threads: 2
  priority: 2
  tls_mode: "auto"

# Configuration validation
schema:
  pool: "str(1,255)"
  port: port
  wallet: str
  worker: "str(1,64)"
  threads: "int(1,256)"
  priority: "int(0,5)"
  tls_mode: "list(auto|enabled|disabled)"
